# Verifies the kit: tests, generated output matches src/, Claude Code accepts the plugins, and a
# user-scoped install from this checkout works. deploy.yml runs the same checks before releasing.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (generator, sync, hooks)
        run: npm test

      - name: Generated output matches src/
        run: npm run check

      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code

      - name: Validate marketplace and plugins
        run: npm run validate:claude

      - name: Install the plugins at user scope (smoke test)
        run: npm run smoke:claude
