# Verifies the kit: tests, generated output matches src/, and Claude Code accepts the plugins.
# On a version tag (vX.Y.Z) it also checks the tag matches package.json (done inside `npm run check`).
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (generator, sync, hooks)
        run: npm test

      - name: Generated output matches src/
        run: npm run check

      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code

      - name: Validate marketplace and plugins
        run: npm run validate:claude
